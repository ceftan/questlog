<!DOCTYPE html>
<html>
  <head>
    <title>Калькулятор Опыта</title>
    <link rel="stylesheet" href="calcstyle.css" />
  </head>
  <body>
      <header>
        <a href="../index.html">Главная</a>
        <a href="calc.html">Калькулятор опыта</a>
      </header>
      <main>
          <h1>Калькулятор опыта:</h1>
<form id="kf_diff">
  <fieldset>
    <legend>Выберите коэффициент сложности:</legend>


    <label>
      <input type="radio" name="choice" value="0.7" checked>Лёгкий 0.7
    </label><br>

    <label>
      <input type="radio" name="choice" value="1"> Обычный 1.0
    </label><br>

<label>
      <input type="radio" name="choice" value="1.3">Средний 1.3
    </label><br>

    <label>
      <input type="radio" name="choice" value="1.6"> Тяжёлый 1.6
    </label><br>

    
    <label>
      <input type="radio" name="choice" id="custom_kf_dif_btn" value=""> Свой вариант:
      <input type="number" id="custom_kf_dif" placeholder="0.7" disabled>
    </label>
  </fieldset>
</form>

<form id="kf_conc">
  <fieldset>
    <legend>Выберите коэффициент концентрации:</legend>


    <label>
      <input type="radio" name="choice" value="0.5" checked> Пассив 0.5
    </label><br>

    <label>
      <input type="radio" name="choice" value="1"> Нормально 1.0
    </label><br>

    <label>
      <input type="radio" name="choice" value="1.2"> Что-то среднее 1.2
    </label><br>

    <label>
      <input type="radio" name="choice" value="1.5"> Глубокий фокус 1.5
    </label><br>

    
    <label>
      <input type="radio" name="choice" id="custom_kf_conc_btn" value=""> Свой вариант:
      <input type="number" id="custom_kf_conc" placeholder="0.5" disabled>
    </label>
  </fieldset>
</form>
          <p>Введите количество потраченных минут:</p>
          <input id="quest_time" type="number" placeholder="0" min="1">
          <pre></pre><button id="calc_xp_button">Посчитать опыт</button>
          <p>Посчитанный опыт:<span id="calc_xp"></span></p>
      </main>
      <footer>
      </footer>
      <script src="calc.js"></script>
  </body>
</html>
